<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm cream background -->
  <rect width="64" height="64" rx="14" fill="#FBF9F6"/>
  <!-- Elegant calligraphic "A" using system serif — works in all browsers without loading external fonts -->
  <text
    x="32"
    y="50"
    font-family="Georgia, 'Palatino Linotype', Palatino, 'Book Antiqua', serif"
    font-size="50"
    font-style="italic"
    font-weight="700"
    fill="#6C4422"
    text-anchor="middle"
    dominant-baseline="auto"
  >A</text>
</svg>
